<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A16"/>
      <stop offset="50%" stop-color="#142621"/>
      <stop offset="100%" stop-color="#091310"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B382F"/>
      <stop offset="100%" stop-color="#10221C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <g stroke="rgba(16, 185, 129, 0.05)" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <circle cx="400" cy="240" r="180" fill="#10b981" opacity="0.08" filter="blur(40px)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="35" width="700" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>

    <rect x="50" y="35" width="700" height="46" rx="16" fill="#0D1C17"/>
    <rect x="50" y="65" width="700" height="16" fill="#0D1C17"/>
    <line x1="50" y1="81" x2="750" y2="81" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>

    <circle cx="75" cy="58" r="5" fill="#EF4444"/>
    <circle cx="93" cy="58" r="5" fill="#F59E0B"/>
    <circle cx="111" cy="58" r="5" fill="#10B981"/>

    <text x="135" y="62" fill="#F8F4E9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Stampy // Auditor Financiero en Telegram</text>

    <rect x="580" y="47" width="150" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="594" cy="58" r="3.5" fill="#10B981"/>
    <text x="604" y="62" fill="#34D399" font-family="monospace" font-size="10.5" font-weight="600">TELEGRAM BOT</text>
  </g>

  <!-- Telegram Message Inbound -->
  <g>
    <rect x="80" y="105" width="460" height="60" rx="14" fill="#132B23" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="100" y="128" fill="#F8F4E9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      📱 Mensaje de voz o texto recibido vía Telegram:
    </text>
    <text x="100" y="149" fill="#6EE7B7" font-family="monospace" font-size="12.5">
      “Gasté $450.00 en insumos de cocina para el restaurante”
    </text>
  </g>

  <!-- Dual-Scope Classification Output -->
  <g>
    <rect x="230" y="180" width="490" height="135" rx="14" fill="#0F221B" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2"/>
    <text x="250" y="206" fill="#A7F3D0" font-family="monospace" font-size="12" font-weight="bold">
      [ ✦ AUDITADO // OK ] Clasificador Dual-Scope:
    </text>
    <text x="250" y="232" fill="#F8F4E9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
      • Ámbito: <tspan fill="#34D399" font-weight="bold">NEGOCIO (Gasto Deducible)</tspan>
    </text>
    <text x="250" y="254" fill="#F8F4E9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
      • Categoría: Insumos de Cocina | Proveedor: Distribuidora Alimentos
    </text>
    <text x="250" y="276" fill="#F8F4E9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
      • IVA Acreditable (16%): <tspan fill="#FCD34D" font-weight="bold">$72.00 MXN</tspan> | Base: $378.00 MXN
    </text>
    <text x="250" y="298" fill="#9CA3AF" font-family="monospace" font-size="11">
      ✓ Persistido en libro mayor y sincronizado con dashboard en 180ms.
    </text>
  </g>

  <!-- Metrics Ribbon -->
  <g>
    <rect x="75" y="335" width="650" height="95" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    
    <g transform="translate(100, 352)">
      <text x="0" y="16" fill="#9CA3AF" font-family="monospace" font-size="11">DEDUCCIONES RECUPERADAS</text>
      <text x="0" y="44" fill="#34D399" font-family="monospace" font-size="24" font-weight="bold">100%</text>
    </g>

    <line x1="310" y1="350" x2="310" y2="415" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>

    <g transform="translate(335, 352)">
      <text x="0" y="16" fill="#9CA3AF" font-family="monospace" font-size="11">TIEMPO DE REGISTRO</text>
      <text x="0" y="44" fill="#F8F4E9" font-family="monospace" font-size="24" font-weight="bold">&lt; 3 seg</text>
    </g>

    <line x1="520" y1="350" x2="520" y2="415" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>

    <g transform="translate(545, 352)">
      <text x="0" y="16" fill="#9CA3AF" font-family="monospace" font-size="11">AHORRO EN CONTABILIDAD</text>
      <text x="0" y="44" fill="#A7F3D0" font-family="monospace" font-size="24" font-weight="bold">12h / mes</text>
    </g>
  </g>
</svg>
